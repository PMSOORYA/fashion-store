<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Antigravity Spheres</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Inter', sans-serif;
        }
        canvas {
            display: block;
        }
        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            font-size: 3rem;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            font-weight: 300;
        }
        p {
            font-size: 1rem;
            color: #00e5ff;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
    </style>
    <!-- GSAP for smooth transitions -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

    <div id="ui">
        <h1>ANTIGRAVITY</h1>
        <p>Hover to Repel</p>
    </div>

    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

        // 1. SCENE SETUP
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2('#050505', 0.025);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 10, 30);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // 2. LIGHTING
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        const blueLight = new THREE.PointLight(0x00e5ff, 200, 50);
        blueLight.position.set(-10, 10, 5);
        scene.add(blueLight);

        const accentLight = new THREE.PointLight(0xccff00, 100, 50);
        accentLight.position.set(15, 5, -10);
        scene.add(accentLight);

        // 3. SPHERES & MATERIALS
        const spheres = [];
        const sphereGeometry = new THREE.SphereGeometry(1, 64, 64);
        
        // Base material settings
        const baseMaterialSettings = {
            color: 0xaaaaaa,
            metalness: 0.7,
            roughness: 0.2,
            clearcoat: 1.0,
            clearcoatRoughness: 0.1,
            transparent: true,
            opacity: 0.9
        };

        for (let i = 0; i < 50; i++) {
            // Clone material so we can fade them individually with GSAP
            const mat = new THREE.MeshPhysicalMaterial(baseMaterialSettings);
            const sphere = new THREE.Mesh(sphereGeometry, mat);
            
            // Randomly position within a volume
            sphere.position.x = (Math.random() - 0.5) * 50;
            sphere.position.y = (Math.random() - 0.5) * 40;
            sphere.position.z = (Math.random() - 0.5) * 30 - 5;
            
            // Varied sizing
            const scale = Math.random() * 1.5 + 0.5;
            sphere.scale.set(scale, scale, scale);

            // Antigravity & logic properties
            sphere.userData = {
                driftSpeed: Math.random() * 0.015 + 0.005, // Constant upward drift
                noiseOffsetX: Math.random() * 100,
                noiseOffsetZ: Math.random() * 100,
                baseX: sphere.position.x,
                baseZ: sphere.position.z,
                isResetting: false,
                floatPhase: Math.random() * Math.PI * 2 // Random start phase for the sine wave
            };

            scene.add(sphere);
            spheres.push(sphere);
        }

        // 4. POST-PROCESSING (Depth of Field / Bokeh)
        const renderPass = new RenderPass(scene, camera);
        const bokehPass = new BokehPass(scene, camera, {
            focus: 25.0,        // Focus distance (adjust based on camera pos)
            aperture: 0.0002,   // Very low aperture for massive cinematic scale
            maxblur: 0.015,
            width: window.innerWidth,
            height: window.innerHeight
        });
        
        const composer = new EffectComposer(renderer);
        composer.addPass(renderPass);
        composer.addPass(bokehPass);

        // 5. INTERACTION (Magnetic Repulsion)
        const mouse = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        let mouseInScene = new THREE.Vector3();
        const interactionPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            raycaster.ray.intersectPlane(interactionPlane, mouseInScene);
        });

        // 6. RESIZE HANDLER
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            
            // Required update for BokehPass resolution changes
            bokehPass.renderTargetDepth.width = window.innerWidth;
            bokehPass.renderTargetDepth.height = window.innerHeight;
        });

        // 7. ANIMATION LOOP
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            const msTime = Date.now();

            spheres.forEach(sphere => {
                const data = sphere.userData;

                if (!data.isResetting) {
                    // --- A. Gentle Upward Drift (Antigravity) ---
                    sphere.position.y += data.driftSpeed;

                    // --- B. Noise Wander (using sine combinations to mimic Perlin) ---
                    data.noiseOffsetX += 0.005;
                    data.noiseOffsetZ += 0.004;
                    const noiseX = Math.sin(data.noiseOffsetX) * Math.cos(data.noiseOffsetX * 0.8) * 3;
                    const noiseZ = Math.cos(data.noiseOffsetZ) * Math.sin(data.noiseOffsetZ * 0.6) * 3;
                    
                    // Recover base position + noise
                    sphere.position.x = data.baseX + noiseX;
                    sphere.position.z = data.baseZ + noiseZ;

                    // --- C. Floating "Bob" Effect ---
                    // Math.sin(Date.now() * 0.001) as requested, slightly offset by phase
                    const bob = Math.sin(msTime * 0.001 + data.floatPhase) * 0.03;
                    sphere.position.y += bob;

                    // --- D. Interaction: Magnetic Repulsion ---
                    if (mouseInScene) {
                        const distToMouse = sphere.position.distanceTo(mouseInScene);
                        const repulsionRadius = 8; // Force field radius
                        
                        if (distToMouse < repulsionRadius) {
                            // Calculate force: stronger when closer
                            const force = (repulsionRadius - distToMouse) / repulsionRadius;
                            const direction = new THREE.Vector3().subVectors(sphere.position, mouseInScene).normalize();
                            
                            // Nudge the actual base positions so it "remembers" the push
                            data.baseX += direction.x * force * 0.3;
                            data.baseZ += direction.z * force * 0.3;
                            // Nudge Y, but don't save to base so it keeps drifting up
                            sphere.position.y += direction.y * force * 0.3;
                        }
                    }

                    // --- E. Reset Transition via GSAP ---
                    if (sphere.position.y > 35) {
                        data.isResetting = true;
                        
                        // Pick random new coordinates for the bottom
                        const newX = (Math.random() - 0.5) * 50;
                        const newZ = (Math.random() - 0.5) * 30 - 5;
                        
                        // Fade out
                        gsap.to(sphere.material, {
                            opacity: 0,
                            duration: 1.5,
                            ease: "power2.inOut",
                            onComplete: () => {
                                // Teleport to bottom
                                sphere.position.y = -25;
                                data.baseX = newX;
                                data.baseZ = newZ;
                                
                                // Fade back in slowly
                                gsap.to(sphere.material, {
                                    opacity: 0.9,
                                    duration: 3, // Slow motion authentic feel
                                    ease: "power1.inOut",
                                    onComplete: () => {
                                        data.isResetting = false;
                                    }
                                });
                            }
                        });
                    }
                }
            });

            // Cinematic slow camera pan
            camera.position.x = Math.sin(time * 0.1) * 3;
            camera.lookAt(0, 5, 0);

            // Render using composer for the Depth of Field effect
            composer.render();
        }

        animate();
    </script>
</body>
</html>
